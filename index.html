<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onyx AI v4.2</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    /* ----- RESET & BASE (Dark theme by default) ----- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }
    body.light {
      background: #f6f8fa;
      color: #1f2328;
    }

    /* ----- SIDEBAR (Threads + Controls) ----- */
    .sidebar {
      width: 280px;
      background: #161b22;
      border-right: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      flex-shrink: 0;
      transition: transform 0.3s ease;
      overflow: hidden;
    }
    body.light .sidebar {
      background: #ffffff;
      border-right-color: #d0d7de;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-shrink: 0;
    }
    .sidebar-header h2 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #f0f6fc, #8b949e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .theme-toggle {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #e6edf3;
      padding: 4px 8px;
      border-radius: 6px;
      transition: 0.2s;
    }
    .theme-toggle:hover { background: #30363d; }
    body.light .theme-toggle { color: #1f2328; }
    body.light .theme-toggle:hover { background: #e1e4e8; }

    .new-thread-btn {
      background: #238636;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .new-thread-btn:hover { background: #2ea043; transform: scale(1.02); }

    /* Threads list */
    .threads-container {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 16px;
      padding-right: 4px;
    }
    .threads-container::-webkit-scrollbar { width: 4px; }
    .threads-container::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }

    .thread-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 2px;
      font-size: 14px;
      color: #c9d1d9;
      position: relative;
    }
    .thread-item:hover { background: #21262d; }
    .thread-item.active { background: #1f2937; border-left: 3px solid #58a6ff; }
    body.light .thread-item { color: #24292f; }
    body.light .thread-item:hover { background: #e1e4e8; }
    body.light .thread-item.active { background: #d0d7de; border-left-color: #0969da; }

    .thread-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 8px;
    }
    .thread-delete {
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: 0.2s;
      opacity: 0.4;
    }
    .thread-item:hover .thread-delete { opacity: 1; }
    .thread-delete:hover { background: #30363d; color: #f0f6fc; }
    body.light .thread-delete { color: #57606a; }
    body.light .thread-delete:hover { background: #d0d7de; color: #1f2328; }

    .thread-rename {
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: 0.2s;
      opacity: 0.4;
    }
    .thread-item:hover .thread-rename { opacity: 1; }
    .thread-rename:hover { background: #30363d; color: #f0f6fc; }

    .sidebar-footer {
      flex-shrink: 0;
      font-size: 12px;
      color: #484f58;
      border-top: 1px solid #30363d;
      padding-top: 12px;
      text-align: center;
    }
    body.light .sidebar-footer {
      color: #8b949e;
      border-top-color: #d0d7de;
    }
    .creator-credit {
      font-size: 11px;
      color: #58a6ff;
      margin-top: 4px;
    }

    /* ----- MAIN CHAT ----- */
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0d1117;
      position: relative;
    }
    body.light .main-chat { background: #f6f8fa; }

    .chat-header {
      padding: 16px 32px;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    body.light .chat-header { border-bottom-color: #d0d7de; }
    .chat-header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .chat-header h1 span { color: #58a6ff; }
    .status-badge {
      font-size: 12px;
      background: #21262d;
      padding: 4px 12px;
      border-radius: 20px;
      color: #8b949e;
    }
    body.light .status-badge {
      background: #e1e4e8;
      color: #24292f;
    }

    /* ----- MESSAGES ----- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }

    .message-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeUp 0.3s ease;
    }
    .message-wrapper.user { align-self: flex-end; }
    .message-wrapper.assistant { align-self: flex-start; }

    .message {
      padding: 14px 20px;
      border-radius: 16px;
      line-height: 1.6;
      word-wrap: break-word;
      font-size: 15px;
    }
    .message.user {
      background: #1f2937;
      border-bottom-right-radius: 4px;
      color: #f0f6fc;
    }
    body.light .message.user {
      background: #d0d7de;
      color: #1f2328;
    }
    .message.assistant {
      background: #161b22;
      border-bottom-left-radius: 4px;
      border: 1px solid #30363d;
      color: #e6edf3;
    }
    body.light .message.assistant {
      background: #ffffff;
      border-color: #d0d7de;
      color: #1f2328;
    }

    /* Markdown styles */
    .message h1, .message h2, .message h3 { margin: 8px 0 4px 0; }
    .message p { margin: 4px 0; }
    .message ul, .message ol { padding-left: 24px; margin: 4px 0; }
    .message code:not(pre code) {
      background: #1a1f2a;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
      color: #f0883e;
    }
    body.light .message code:not(pre code) {
      background: #e1e4e8;
      color: #d73a49;
    }
    .message pre {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0;
      position: relative;
      overflow-x: auto;
    }
    body.light .message pre {
      background: #f6f8fa;
      border-color: #d0d7de;
    }
    .message pre code {
      font-size: 14px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }
    .message details {
      margin: 8px 0;
      padding: 8px 12px;
      background: #1a1f2a;
      border-radius: 8px;
      border-left: 3px solid #58a6ff;
    }
    body.light .message details { background: #f0f6fc; }
    .message details summary {
      cursor: pointer;
      font-weight: 600;
      color: #58a6ff;
    }

    .code-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
    }
    .code-actions button {
      background: #21262d;
      color: #c9d1d9;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.6;
      transition: 0.2s;
    }
    .code-actions button:hover { opacity: 1; background: #30363d; }
    body.light .code-actions button {
      background: #d0d7de;
      color: #1f2328;
    }
    body.light .code-actions button:hover { background: #b0b8c0; }

    /* Message actions (edit, regenerate, delete) */
    .message-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      opacity: 0;
      transition: opacity 0.2s;
      justify-content: flex-end;
    }
    .message-wrapper:hover .message-actions { opacity: 1; }
    .message-actions button {
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      transition: 0.2s;
    }
    .message-actions button:hover {
      background: #30363d;
      color: #f0f6fc;
    }
    body.light .message-actions button { color: #57606a; }
    body.light .message-actions button:hover { background: #e1e4e8; color: #1f2328; }

    /* ----- INPUT AREA ----- */
    .input-area {
      padding: 16px 32px 28px;
      background: #0d1117;
      border-top: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    body.light .input-area {
      background: #f6f8fa;
      border-top-color: #d0d7de;
    }
    .input-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    .input-wrapper {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      display: flex;
      align-items: flex-end;
      transition: 0.2s;
      padding: 8px 8px 8px 16px;
    }
    .input-wrapper:focus-within {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
    }
    body.light .input-wrapper {
      background: #ffffff;
      border-color: #d0d7de;
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px 0;
      font-size: 15px;
      color: #f0f6fc;
      outline: none;
      resize: none;
      font-family: inherit;
      max-height: 150px;
    }
    #userInput::placeholder { color: #484f58; }
    body.light #userInput { color: #1f2328; }
    body.light #userInput::placeholder { color: #8b949e; }
    #sendBtn {
      background: #238636;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-weight: 600;
      font-size: 14px;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
      margin: 4px;
    }
    #sendBtn:hover { background: #2ea043; }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .input-controls {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .input-controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #8b949e;
      cursor: pointer;
    }
    body.light .input-controls label { color: #24292f; }
    .input-controls input[type="checkbox"] {
      accent-color: #238636;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .file-upload-wrapper {
      position: relative;
      display: inline-block;
    }
    .file-upload-wrapper input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .file-upload-wrapper button {
      background: #21262d;
      border: none;
      color: #c9d1d9;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }
    .file-upload-wrapper button:hover { background: #30363d; }
    body.light .file-upload-wrapper button {
      background: #e1e4e8;
      color: #24292f;
    }
    body.light .file-upload-wrapper button:hover { background: #d0d7de; }
    .file-name {
      font-size: 12px;
      color: #58a6ff;
      margin-left: 6px;
    }

    /* ----- TYPING ----- */
    .typing-indicator {
      align-self: flex-start;
      padding: 8px 16px;
      color: #8b949e;
      font-size: 14px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:0.5;} 50%{opacity:1;} }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

    /* ----- MOBILE ----- */
    .hamburger {
      display: none;
      background: none;
      border: none;
      color: #f0f6fc;
      font-size: 24px;
      cursor: pointer;
    }
    body.light .hamburger { color: #1f2328; }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 100;
        transform: translateX(-100%);
        width: 280px;
      }
      .sidebar.open { transform: translateX(0); }
      .main-chat { width: 100%; }
      .hamburger { display: flex !important; }
      .chat-header { padding: 12px 16px; }
      #messages { padding: 16px; }
      .input-area { padding: 12px 16px 20px; }
      .message-wrapper { max-width: 92%; }
    }
  </style>
</head>
<body>
  <!-- SIDEBAR (Threads + Controls) -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>⚫ ONYX</h2>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
    </div>
    <button class="new-thread-btn" id="newThreadBtn">➕ New Chat</button>

    <div class="threads-container" id="threadsContainer">
      <!-- Threads will be rendered here -->
    </div>

    <div class="sidebar-footer">
      <div>Onyx v4.2 · Multi‑thread</div>
      <div class="creator-credit">⚡ Created by AgentXCO2</div>
    </div>
  </div>

  <!-- MAIN CHAT -->
  <div class="main-chat">
    <div class="chat-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" id="hamburgerBtn">☰</button>
        <h1>⚫ <span>Onyx</span></h1>
      </div>
      <span class="status-badge">● Online</span>
    </div>

    <div id="messages"></div>

    <div class="input-area">
      <div class="input-row">
        <div class="input-wrapper">
          <textarea id="userInput" rows="1" placeholder="Ask me anything..."></textarea>
          <button id="sendBtn">Send</button>
        </div>
      </div>
      <div class="input-controls">
        <label><input type="checkbox" id="thinkToggle" /> 🧠 Think</label>
        <label><input type="checkbox" id="searchToggle" /> 🌐 Search</label>
        <div class="file-upload-wrapper">
          <button>📎 Upload File</button>
          <input type="file" id="fileInput" />
        </div>
        <span class="file-name" id="fileName"></span>
      </div>
    </div>
  </div>

  <script>
    // ===== CONFIG =====
    const BACKEND_URL = 'https://onyx-intelligence-5p3i.onrender.com/api/chat';
    const SYSTEM_URL = 'https://onyx-intelligence-5p3i.onrender.com/api/system';
    const CLEAR_URL = 'https://onyx-intelligence-5p3i.onrender.com/api/clear';
    const EXPORT_URL = 'https://onyx-intelligence-5p3i.onrender.com/api/memory';

    // ===== DOM REFS =====
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const newThreadBtn = document.getElementById('newThreadBtn');
    const threadsContainer = document.getElementById('threadsContainer');
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const sidebar = document.getElementById('sidebar');
    const themeToggle = document.getElementById('themeToggle');
    const thinkToggle = document.getElementById('thinkToggle');
    const searchToggle = document.getElementById('searchToggle');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');

    let fileContent = null;
    let currentThreadId = null;

    // ===== THREADS DATA =====
    const THREADS_KEY = 'onyx_threads';
    const CURRENT_THREAD_KEY = 'onyx_current_thread';

    function getThreads() {
      const stored = localStorage.getItem(THREADS_KEY);
      if (stored) {
        try { return JSON.parse(stored); } catch (e) { return {}; }
      }
      // Default: create one thread with a welcome message
      const defaultId = Date.now().toString();
      const threads = {};
      threads[defaultId] = {
        id: defaultId,
        title: 'New Chat',
        messages: [{ role: 'assistant', content: 'Hello, I\'m **Onyx v4.2** with multi‑thread support. I know my creator is **AgentXCO2**. How can I help?' }],
        createdAt: defaultId,
        updatedAt: defaultId
      };
      localStorage.setItem(THREADS_KEY, JSON.stringify(threads));
      return threads;
    }

    function saveThreads(threads) {
      localStorage.setItem(THREADS_KEY, JSON.stringify(threads));
    }

    function getCurrentThreadId() {
      const id = localStorage.getItem(CURRENT_THREAD_KEY);
      const threads = getThreads();
      if (id && threads[id]) return id;
      // otherwise return the first thread
      const keys = Object.keys(threads);
      if (keys.length === 0) {
        // create a new one
        const newId = Date.now().toString();
        threads[newId] = { id: newId, title: 'New Chat', messages: [{ role: 'assistant', content: 'New thread. Ask me anything!' }], createdAt: newId, updatedAt: newId };
        saveThreads(threads);
        return newId;
      }
      return keys[0];
    }

    function setCurrentThreadId(id) {
      localStorage.setItem(CURRENT_THREAD_KEY, id);
      currentThreadId = id;
    }

    function getThreadMessages(threadId) {
      const threads = getThreads();
      return threads[threadId]?.messages || [];
    }

    function updateThreadMessages(threadId, messages) {
      const threads = getThreads();
      if (!threads[threadId]) return;
      threads[threadId].messages = messages;
      threads[threadId].updatedAt = Date.now().toString();
      // auto-generate title from first user message if title is "New Chat" and there is at least one user message
      const firstUser = messages.find(m => m.role === 'user');
      if (firstUser && threads[threadId].title === 'New Chat') {
        const preview = firstUser.content.slice(0, 30) + (firstUser.content.length > 30 ? '…' : '');
        threads[threadId].title = preview || 'New Chat';
      }
      saveThreads(threads);
    }

    function createNewThread() {
      const threads = getThreads();
      const id = Date.now().toString();
      threads[id] = {
        id: id,
        title: 'New Chat',
        messages: [{ role: 'assistant', content: 'New thread. Ask me anything!' }],
        createdAt: id,
        updatedAt: id
      };
      saveThreads(threads);
      setCurrentThreadId(id);
      renderThreads();
      renderMessages();
      // close sidebar on mobile
      if (window.innerWidth <= 768) sidebar.classList.remove('open');
    }

    function deleteThread(id) {
      if (!confirm('Delete this chat thread?')) return;
      const threads = getThreads();
      delete threads[id];
      saveThreads(threads);
      const keys = Object.keys(threads);
      if (keys.length === 0) {
        // create a new default thread
        const newId = Date.now().toString();
        threads[newId] = { id: newId, title: 'New Chat', messages: [{ role: 'assistant', content: 'New thread. Ask me anything!' }], createdAt: newId, updatedAt: newId };
        saveThreads(threads);
        setCurrentThreadId(newId);
      } else {
        setCurrentThreadId(keys[0]);
      }
      renderThreads();
      renderMessages();
    }

    function renameThread(id, newTitle) {
      if (!newTitle || newTitle.trim() === '') return;
      const threads = getThreads();
      if (!threads[id]) return;
      threads[id].title = newTitle.trim();
      saveThreads(threads);
      renderThreads();
    }

    // ===== RENDER THREADS =====
    function renderThreads() {
      const threads = getThreads();
      const currentId = getCurrentThreadId();
      threadsContainer.innerHTML = '';
      // Sort by updatedAt descending (most recent first)
      const sorted = Object.values(threads).sort((a, b) => parseInt(b.updatedAt) - parseInt(a.updatedAt));
      sorted.forEach(thread => {
        const div = document.createElement('div');
        div.className = 'thread-item' + (thread.id === currentId ? ' active' : '');
        const titleSpan = document.createElement('span');
        titleSpan.className = 'thread-title';
        titleSpan.textContent = thread.title || 'Untitled';
        div.appendChild(titleSpan);

        // Rename button
        const renameBtn = document.createElement('button');
        renameBtn.className = 'thread-rename';
        renameBtn.textContent = '✏️';
        renameBtn.title = 'Rename thread';
        renameBtn.onclick = (e) => {
          e.stopPropagation();
          const newTitle = prompt('Enter new thread name:', thread.title);
          if (newTitle !== null) renameThread(thread.id, newTitle);
        };
        div.appendChild(renameBtn);

        // Delete button
        const delBtn = document.createElement('button');
        delBtn.className = 'thread-delete';
        delBtn.textContent = '🗑️';
        delBtn.title = 'Delete thread';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteThread(thread.id);
        };
        div.appendChild(delBtn);

        // Click to switch
        div.addEventListener('click', () => {
          if (thread.id !== currentId) {
            setCurrentThreadId(thread.id);
            renderThreads();
            renderMessages();
          }
        });

        threadsContainer.appendChild(div);
      });
    }

    // ===== RENDER MESSAGES =====
    function renderMessages() {
      const threadId = getCurrentThreadId();
      const messages = getThreadMessages(threadId);
      messagesDiv.innerHTML = '';
      messages.forEach((msg, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${msg.role}`;
        wrapper.dataset.index = index;

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${msg.role}`;
        messageDiv.innerHTML = renderMarkdown(msg.content);
        wrapper.appendChild(messageDiv);

        const actions = document.createElement('div');
        actions.className = 'message-actions';
        if (msg.role === 'user') {
          const editBtn = document.createElement('button');
          editBtn.textContent = '✏️';
          editBtn.title = 'Edit message';
          editBtn.onclick = (e) => {
            e.stopPropagation();
            startEditing(index);
          };
          actions.appendChild(editBtn);
        } else if (msg.role === 'assistant') {
          const regenBtn = document.createElement('button');
          regenBtn.textContent = '🔄';
          regenBtn.title = 'Regenerate response';
          regenBtn.onclick = (e) => {
            e.stopPropagation();
            regenerate(index);
          };
          actions.appendChild(regenBtn);
        }
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '🗑️';
        deleteBtn.title = 'Delete this and all later messages';
        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          deleteFrom(index);
        };
        actions.appendChild(deleteBtn);
        wrapper.appendChild(actions);
        messagesDiv.appendChild(wrapper);
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // ===== RENDER MARKDOWN =====
    function renderMarkdown(text) {
      const rawHtml = marked.parse(text);
      const temp = document.createElement('div');
      temp.innerHTML = rawHtml;
      temp.querySelectorAll('pre code').forEach((block) => {
        const pre = block.parentElement;
        const actions = document.createElement('div');
        actions.className = 'code-actions';
        const copyBtn = document.createElement('button');
        copyBtn.textContent = 'Copy';
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(block.textContent);
          copyBtn.textContent = 'Copied!';
          setTimeout(() => copyBtn.textContent = 'Copy', 2000);
        };
        const downloadBtn = document.createElement('button');
        downloadBtn.textContent = 'Download';
        downloadBtn.onclick = () => {
          const blob = new Blob([block.textContent], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'code.txt';
          a.click();
          URL.revokeObjectURL(url);
        };
        actions.appendChild(copyBtn);
        actions.appendChild(downloadBtn);
        pre.style.position = 'relative';
        pre.prepend(actions);
        hljs.highlightElement(block);
      });
      return temp.innerHTML;
    }

    // ===== THREAD OPERATIONS =====
    function getCurrentMessages() {
      const threadId = getCurrentThreadId();
      return getThreadMessages(threadId);
    }

    function setCurrentMessages(messages) {
      const threadId = getCurrentThreadId();
      updateThreadMessages(threadId, messages);
    }

    // ===== ADD MESSAGE =====
    function addMessage(role, content) {
      const messages = getCurrentMessages();
      messages.push({ role, content });
      setCurrentMessages(messages);
      renderMessages();
      renderThreads(); // update thread list (title might change)
    }

    // ===== DELETE FROM INDEX =====
    function deleteFrom(index) {
      if (!confirm('Delete this and all later messages?')) return;
      const messages = getCurrentMessages();
      const newMessages = messages.slice(0, index);
      setCurrentMessages(newMessages);
      renderMessages();
      renderThreads();
    }

    // ===== EDIT =====
    function startEditing(index) {
      const messages = getCurrentMessages();
      const msg = messages[index];
      if (msg.role !== 'user') return;
      input.value = msg.content;
      input.focus();
      const newMessages = messages.slice(0, index);
      setCurrentMessages(newMessages);
      renderMessages();
      renderThreads();
    }

    // ===== REGENERATE =====
    async function regenerate(index) {
      const messages = getCurrentMessages();
      const msg = messages[index];
      if (msg.role !== 'assistant') return;
      let userIndex = index - 1;
      while (userIndex >= 0 && messages[userIndex].role !== 'user') userIndex--;
      if (userIndex < 0) return;
      const userMsg = messages[userIndex];
      const newMessages = messages.slice(0, index);
      setCurrentMessages(newMessages);
      renderMessages();
      renderThreads();
      await sendMessageWithText(userMsg.content);
    }

    // ===== SEND MESSAGE =====
    async function sendMessage() {
      const text = input.value.trim();
      if (!text && !fileContent) return;
      await sendMessageWithText(text);
    }

    async function sendMessageWithText(text) {
      const userMessage = text || '📎 Uploaded file';
      if (fileContent) {
        const displayMsg = userMessage + (fileContent ? `\n\n📎 **File:** ${fileName.textContent}` : '');
        addMessage('user', displayMsg);
      } else {
        addMessage('user', userMessage);
      }

      const payload = {
        message: text,
        thinking: thinkToggle.checked,
        search: searchToggle.checked,
        fileContent: fileContent || null,
        useMemory: true // we keep memory on server as well, but we also store locally
      };

      fileInput.value = '';
      fileName.textContent = '';
      fileContent = null;

      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;
      input.disabled = true;

      // Add placeholder assistant message
      const messages = getCurrentMessages();
      messages.push({ role: 'assistant', content: '' });
      setCurrentMessages(messages);
      renderMessages();
      renderThreads();
      const assistantIndex = messages.length - 1;

      const typingDiv = document.createElement('div');
      typingDiv.className = 'typing-indicator';
      typingDiv.textContent = 'Onyx is thinking...';
      messagesDiv.appendChild(typingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        typingDiv.remove();

        if (!response.ok) {
          const err = await response.json();
          const currentMsgs = getCurrentMessages();
          currentMsgs[assistantIndex].content = `⚠️ ${err.error || 'Something went wrong.'}`;
          setCurrentMessages(currentMsgs);
          renderMessages();
          renderThreads();
          sendBtn.disabled = false;
          input.disabled = false;
          input.focus();
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let fullContent = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const payload = line.slice(6);
              if (payload === '[DONE]') continue;
              try {
                const json = JSON.parse(payload);
                if (json.content) {
                  fullContent += json.content;
                  const currentMsgs = getCurrentMessages();
                  currentMsgs[assistantIndex].content = fullContent;
                  setCurrentMessages(currentMsgs);
                  renderMessages();
                  renderThreads();
                }
                if (json.error) {
                  const currentMsgs = getCurrentMessages();
                  currentMsgs[assistantIndex].content = `⚠️ ${json.error}`;
                  setCurrentMessages(currentMsgs);
                  renderMessages();
                  renderThreads();
                }
              } catch (e) {}
            }
          }
        }
      } catch (error) {
        typingDiv.remove();
        const currentMsgs = getCurrentMessages();
        currentMsgs[assistantIndex].content = '❌ Failed to connect to backend. Ensure Render is awake.';
        setCurrentMessages(currentMsgs);
        renderMessages();
        renderThreads();
        console.error(error);
      }

      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }

    // ===== NEW THREAD =====
    function newThread() {
      createNewThread();
    }

    // ===== CLEAR MEMORY (server side) - not needed for local threads, but we keep for sync =====
    // Not used directly, but we can call it if needed.

    // ===== EXPORT (export current thread or all?) =====
    // We'll export all threads as a single JSON
    function exportAllThreads() {
      const threads = getThreads();
      const data = JSON.stringify(threads, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `onyx_threads_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ===== THEME =====
    let darkMode = true;
    themeToggle.addEventListener('click', () => {
      darkMode = !darkMode;
      document.body.classList.toggle('light', !darkMode);
      themeToggle.textContent = darkMode ? '🌙' : '☀️';
    });

    // ===== SIDEBAR TOGGLE =====
    hamburgerBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 768) {
        if (!sidebar.contains(e.target) && e.target !== hamburgerBtn) {
          sidebar.classList.remove('open');
        }
      }
    });

    // ===== INPUT =====
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 150) + 'px';
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    sendBtn.addEventListener('click', sendMessage);

    // ===== FILE UPLOAD =====
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) { fileName.textContent = ''; fileContent = null; return; }
      fileName.textContent = file.name;
      const reader = new FileReader();
      reader.onload = (ev) => {
        fileContent = ev.target.result;
      };
      reader.readAsText(file);
    });

    // ===== NEW THREAD BUTTON =====
    newThreadBtn.addEventListener('click', newThread);

    // ===== EXPORT BUTTON (add to sidebar) =====
    // We'll add a small export button in the sidebar footer
    // Or we can add an action button in the sidebar-actions area.
    // Let's add it dynamically in the sidebar footer.
    const footer = document.querySelector('.sidebar-footer');
    const exportBtn = document.createElement('button');
    exportBtn.textContent = '📤 Export All Threads';
    exportBtn.style.cssText = 'background: #21262d; border: none; color: #c9d1d9; padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-top: 8px; width: 100%;';
    exportBtn.onclick = exportAllThreads;
    footer.appendChild(exportBtn);

    // Also we can add a clear all threads button (danger)
    const clearAllBtn = document.createElement('button');
    clearAllBtn.textContent = '🗑️ Delete All Threads';
    clearAllBtn.style.cssText = 'background: #da3633; border: none; color: white; padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-top: 4px; width: 100%;';
    clearAllBtn.onclick = () => {
      if (!confirm('Delete ALL threads? This cannot be undone.')) return;
      localStorage.removeItem(THREADS_KEY);
      localStorage.removeItem(CURRENT_THREAD_KEY);
      // reload the page to reset
      location.reload();
    };
    footer.appendChild(clearAllBtn);

    // ===== INIT =====
    // Ensure we have at least one thread
    getThreads(); // initializes if empty
    const currentId = getCurrentThreadId();
    setCurrentThreadId(currentId);
    renderThreads();
    renderMessages();
  </script>
</body>
</html>
